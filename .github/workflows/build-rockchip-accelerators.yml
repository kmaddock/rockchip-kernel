name: Build Rockchip Accelerator Drivers

on:
  pull_request:
    paths:
      - .github/workflows/build-rockchip-accelerators.yml
      - Kconfig
      - Makefile
      - config-6.1.0-odroid-arm64
      - drivers/Kconfig
      - drivers/rknpu/**
      - drivers/video/rockchip/**
      - scripts/config
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/build-rockchip-accelerators.yml
      - Kconfig
      - Makefile
      - config-6.1.0-odroid-arm64
      - drivers/Kconfig
      - drivers/rknpu/**
      - drivers/video/rockchip/**
      - scripts/config
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Rockchip MPP
            id: mpp
            modules: drivers/video/rockchip/mpp/rk_vcodec.ko
            package: rockchip-mpp-modules
            description: Rockchip MPP kernel module
          - name: Rockchip RKNPU
            id: rknpu
            modules: drivers/rknpu/rknpu.ko
            package: rockchip-rknpu-modules
            description: Rockchip RKNPU kernel module
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      O: ${{ github.workspace }}/out/${{ matrix.target.id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            ccache \
            dpkg-dev \
            flex \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libelf-dev \
            libssl-dev \
            make \
            pahole

      - name: Prepare base config
        run: |
          mkdir -p "$O"
          chmod +x scripts/config
          cp config-6.1.0-odroid-arm64 "$O/.config"

      - name: Enable target-specific config
        shell: bash
        run: |
          case "${{ matrix.target.id }}" in
            mpp)
              scripts/config --file "$O/.config" \
                -m ROCKCHIP_MPP_SERVICE \
                -e ROCKCHIP_MPP_OSAL \
                -e ROCKCHIP_MPP_RKVDEC \
                -e ROCKCHIP_MPP_RKVDEC2 \
                -e ROCKCHIP_MPP_RKVENC \
                -e ROCKCHIP_MPP_RKVENC2 \
                -e ROCKCHIP_MPP_VDPU1 \
                -e ROCKCHIP_MPP_VEPU1 \
                -e ROCKCHIP_MPP_VDPU2 \
                -e ROCKCHIP_MPP_VEPU2 \
                -e ROCKCHIP_MPP_IEP2 \
                -e ROCKCHIP_MPP_JPGDEC \
                -e ROCKCHIP_MPP_JPGENC \
                -e ROCKCHIP_MPP_AV1DEC \
                -e ROCKCHIP_MPP_VDPP
              ;;
            rknpu)
              scripts/config --file "$O/.config" \
                -m ROCKCHIP_RKNPU \
                -e ROCKCHIP_RKNPU_DEBUG_FS \
                -e ROCKCHIP_RKNPU_PROC_FS \
                -e ROCKCHIP_RKNPU_FENCE
              ;;
          esac

          make O="$O" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

      - name: Prepare generated headers
        run: |
          make O="$O" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" prepare modules_prepare

      - name: Build target modules
        run: |
          make -j"$(nproc)" O="$O" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            ${{ matrix.target.modules }}

      - name: Package modules as Debian package
        id: package_deb
        shell: bash
        run: |
          set -euo pipefail

          kernelrelease=$(make -s O="$O" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" kernelrelease)
          package_root="$RUNNER_TEMP/${{ matrix.target.id }}-deb"
          package_version="0+git${GITHUB_SHA::12}"
          deb_name="${{ matrix.target.package }}_${package_version}_arm64.deb"
          deb_path="$RUNNER_TEMP/$deb_name"

          rm -rf "$package_root"
          mkdir -p "$package_root/DEBIAN"
          mkdir -p "$package_root/lib/modules/$kernelrelease/extra"
          mkdir -p "$package_root/usr/share/doc/${{ matrix.target.package }}"

          install -m 0644 "$O/${{ matrix.target.modules }}" \
            "$package_root/lib/modules/$kernelrelease/extra/"
          install -m 0644 "$O/.config" \
            "$package_root/usr/share/doc/${{ matrix.target.package }}/build.config"

          cat > "$package_root/DEBIAN/control" <<EOF
          Package: ${{ matrix.target.package }}
          Version: ${package_version}
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: GitHub Actions <actions@github.com>
          Description: ${{ matrix.target.description }}
           Built from ${GITHUB_REPOSITORY} at ${GITHUB_SHA}.
          EOF

          dpkg-deb --build --root-owner-group "$package_root" "$deb_path"

          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"
          echo "kernelrelease=$kernelrelease" >> "$GITHUB_OUTPUT"

      - name: Upload built modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}-modules
          path: ${{ env.O }}/${{ matrix.target.modules }}

      - name: Upload Debian package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}-deb
          path: ${{ steps.package_deb.outputs.deb_path }}

      - name: Upload resolved config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}-config
          path: ${{ env.O }}/.config