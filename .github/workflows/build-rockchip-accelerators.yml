name: Build Rockchip Accelerator Drivers

on:
  pull_request:
    paths:
      - .github/workflows/build-rockchip-accelerators.yml
      - Kconfig
      - Makefile
      - config-6.1.0-odroid-arm64
      - drivers/Kconfig
      - drivers/rknpu/**
      - drivers/video/rockchip/**
      - scripts/config
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/build-rockchip-accelerators.yml
      - Kconfig
      - Makefile
      - config-6.1.0-odroid-arm64
      - drivers/Kconfig
      - drivers/rknpu/**
      - drivers/video/rockchip/**
      - scripts/config
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Rockchip modules
    runs-on: ubuntu-24.04
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      O: ${{ github.workspace }}/out/rockchip-modules
      KERNELRELEASE_OVERRIDE: 6.1.0-odroid-arm64
      MODULES: >-
        drivers/video/rockchip/mpp/rk_vcodec.ko
        drivers/rknpu/rknpu.ko
      PACKAGE_NAME: rockchip-accelerator-modules
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            ccache \
            dpkg-dev \
            flex \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libelf-dev \
            libssl-dev \
            make \
            pahole

      - name: Prepare base config
        run: |
          mkdir -p "$O"
          chmod +x scripts/config
          cp config-6.1.0-odroid-arm64 "$O/.config"

      - name: Enable target-specific config
        shell: bash
        run: |
          # Keep module ABI compatible with kernels that do not export
          # Rockchip vendor PM/IOMMU and dmabuf cache symbols.
          scripts/config --file "$O/.config" \
            -d ROCKCHIP_IOMMU \
            -d ROCKCHIP_PM_DOMAINS \
            -d DMABUF_CACHE \
            -m ROCKCHIP_MPP_SERVICE \
            -e ROCKCHIP_MPP_OSAL \
            -e ROCKCHIP_MPP_RKVDEC \
            -e ROCKCHIP_MPP_RKVDEC2 \
            -e ROCKCHIP_MPP_RKVENC \
            -e ROCKCHIP_MPP_RKVENC2 \
            -e ROCKCHIP_MPP_VDPU1 \
            -e ROCKCHIP_MPP_VEPU1 \
            -e ROCKCHIP_MPP_VDPU2 \
            -e ROCKCHIP_MPP_VEPU2 \
            -e ROCKCHIP_MPP_IEP2 \
            -e ROCKCHIP_MPP_JPGDEC \
            -e ROCKCHIP_MPP_JPGENC \
            -e ROCKCHIP_MPP_AV1DEC \
            -e ROCKCHIP_MPP_VDPP \
            -m ROCKCHIP_RKNPU \
            -e ROCKCHIP_RKNPU_DEBUG_FS \
            -e ROCKCHIP_RKNPU_PROC_FS \
            -e ROCKCHIP_RKNPU_FENCE

          make O="$O" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            KERNELRELEASE="$KERNELRELEASE_OVERRIDE" olddefconfig

      - name: Prepare generated headers
        run: |
          make O="$O" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            KERNELRELEASE="$KERNELRELEASE_OVERRIDE" prepare modules_prepare

      - name: Build target modules
        run: |
          make -j"$(nproc)" O="$O" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            KERNELRELEASE="$KERNELRELEASE_OVERRIDE" \
            $MODULES

      - name: Package modules as Debian package
        id: package_deb
        shell: bash
        run: |
          set -euo pipefail

          kernelrelease="$KERNELRELEASE_OVERRIDE"
          package_root="$RUNNER_TEMP/rockchip-modules-deb"
          package_version="0+git${GITHUB_SHA::12}"
          deb_name="${PACKAGE_NAME}_${package_version}_arm64.deb"
          deb_path="$RUNNER_TEMP/$deb_name"

          rm -rf "$package_root"
          mkdir -p "$package_root/DEBIAN"
          mkdir -p "$package_root/lib/modules/$kernelrelease/extra"
          mkdir -p "$package_root/usr/share/doc/$PACKAGE_NAME"

          for module in $MODULES; do
            install -m 0644 "$O/$module" \
              "$package_root/lib/modules/$kernelrelease/extra/"
          done
          install -m 0644 "$O/.config" \
            "$package_root/usr/share/doc/$PACKAGE_NAME/build.config"

          cat > "$package_root/DEBIAN/control" <<EOF
          Package: ${PACKAGE_NAME}
          Version: ${package_version}
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: GitHub Actions <actions@github.com>
          Description: Rockchip accelerator kernel modules
           Built from ${GITHUB_REPOSITORY} at ${GITHUB_SHA}.
          EOF

          dpkg-deb --build --root-owner-group "$package_root" "$deb_path"

          echo "deb_path=$deb_path" >> "$GITHUB_OUTPUT"
          echo "kernelrelease=$kernelrelease" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        if: success() && github.event_name != 'pull_request'
        id: release_meta
        shell: bash
        run: |
          release_tag="rockchip-accelerator-modules-${GITHUB_RUN_NUMBER}"
          release_name="Rockchip accelerator modules ${GITHUB_RUN_NUMBER}"

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Upload built modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockchip-modules
          path: |
            ${{ env.O }}/drivers/video/rockchip/mpp/rk_vcodec.ko
            ${{ env.O }}/drivers/rknpu/rknpu.ko

      - name: Upload Debian package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockchip-modules-deb
          path: ${{ steps.package_deb.outputs.deb_path }}

      - name: Upload resolved config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockchip-modules-config
          path: ${{ env.O }}/.config

      - name: Publish GitHub release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          files: |
            ${{ steps.package_deb.outputs.deb_path }}
            ${{ env.O }}/drivers/video/rockchip/mpp/rk_vcodec.ko
            ${{ env.O }}/drivers/rknpu/rknpu.ko
            ${{ env.O }}/.config